services:
  vote:
    build: ./vote
    environment:
      - OPTION_A=${VOTE_OPTION_A:-Cats}
      - OPTION_B=${VOTE_OPTION_B:-Dogs}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=8000
    ports:
      - "127.0.0.1:${VOTE_SERVICE_PORT:-8080}:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - back-tier
    restart: unless-stopped

  result:
    build: ./result
    environment:
      - PORT=8000
      - PG_HOST=db
      - PG_PORT=5432
      - PG_USER=${POSTGRES_USER}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      - PG_DATABASE=${POSTGRES_DB}
    ports:
      - "127.0.0.1:${RESULT_SERVICE_PORT:-8081}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - back-tier
    restart: unless-stopped

  worker:
    build: ./worker
    environment:
      - DB_HOST=db
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - back-tier
    restart: unless-stopped

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - back-tier
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - "db-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - back-tier
    restart: unless-stopped

volumes:
  db-data:

networks:
  back-tier: